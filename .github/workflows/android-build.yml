name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifikasi UI (hash + sintaks JS + pemeriksaan rahasia)
        run: bash scripts/verify-ui.sh

  build:
    needs: verify-ui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Pasang SDK/NDK/CMake yang dipatok
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit test
        working-directory: BoxAI-Android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: BoxAI-Android
        run: gradle --no-daemon assembleDebug

      - name: Catat versi toolchain
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "jdk: ${JAVA_VERSION}  gradle: ${GRADLE_VERSION}  agp: 8.5.2  kotlin: 2.0.20"
            echo "ndk: ${NDK_VERSION}  cmake: ${CMAKE_VERSION}  compileSdk: 34"
            echo "catatan: build hijau BUKAN bukti inferensi GGUF bekerja; uji di perangkat."
          } | tee build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: boxai-debug-apk
          path: |
            BoxAI-Android/app/build/outputs/apk/debug/*.apk
            build-info.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Pasang SDK/NDK/CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_B64: ${{ secrets.BOXAI_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "BOXAI_KEYSTORE_B64 belum diset; release ditolak agar APK update tetap bisa diverifikasi signature-nya."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/boxai.jks"
          echo "BOXAI_KEYSTORE_PATH=$RUNNER_TEMP/boxai.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: BoxAI-Android
        env:
          BOXAI_KEYSTORE_PASSWORD: ${{ secrets.BOXAI_KEYSTORE_PASSWORD }}
          BOXAI_KEY_ALIAS: ${{ secrets.BOXAI_KEY_ALIAS }}
          BOXAI_KEY_PASSWORD: ${{ secrets.BOXAI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: boxai-release-apk
          path: BoxAI-Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Verifikasi APK release
        run: |
          APK=$(find BoxAI-Android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
      - name: Terbitkan GitHub Release dan APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: BoxAI-Android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
