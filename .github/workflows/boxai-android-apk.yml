name: Build Box AI APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
        continue-on-error: true

      - name: Install Android commandline tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/tmp/lic.txt 2>&1 || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: BoxAI-Android
        env:
          BOXAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.BOXAI_RELEASE_KEYSTORE_BASE64 }}
          BOXAI_RELEASE_STORE_PASSWORD: ${{ secrets.BOXAI_RELEASE_STORE_PASSWORD }}
          BOXAI_RELEASE_KEY_ALIAS: ${{ secrets.BOXAI_RELEASE_KEY_ALIAS }}
          BOXAI_RELEASE_KEY_PASSWORD: ${{ secrets.BOXAI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BOXAI_RELEASE_KEYSTORE_BASE64"
          test -n "$BOXAI_RELEASE_STORE_PASSWORD"
          test -n "$BOXAI_RELEASE_KEY_ALIAS"
          test -n "$BOXAI_RELEASE_KEY_PASSWORD"
          printf '%s' "$BOXAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boxai-release.jks"
          chmod 600 "$RUNNER_TEMP/boxai-release.jks"
          echo "BOXAI_RELEASE_KEYSTORE=$RUNNER_TEMP/boxai-release.jks" >> "$GITHUB_ENV"
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          gradle assembleRelease --stacktrace

      - name: Assemble debug APK for branch verification
        if: startsWith(github.ref, 'refs/tags/v') == false
        working-directory: BoxAI-Android
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          gradle assembleDebug --stacktrace

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BoxAI-release-apk
          path: BoxAI-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BoxAI-debug-apk
          path: BoxAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: BoxAI-Android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
