name: Build Box AI APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BoxAI-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble release APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BoxAI-v0.1.0-apk
          path: BoxAI-Android/app/build/outputs/apk/debug/app-debug.apk
