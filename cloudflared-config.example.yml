# Contoh konfigurasi cloudflared untuk Box AI
# Cara pakai:
# 1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/install-and-setup/installation/
# 2. Login: cloudflared tunnel login
# 3. Buat tunnel: cloudflared tunnel create box-ai
# 4. Copy file ini ke ~/.cloudflared/config.yml dan sesuaikan
# 5. Jalankan: cloudflared tunnel run box-ai

tunnel: <TUNNEL-ID>
credentials-file: /home/user/.cloudflared/<TUNNEL-ID>.json

ingress:
  # Contoh expose Flutter web (setelah flutter run -d web-server --web-port 8080)
  - hostname: box-ai.yourdomain.com
    service: http://localhost:8080
  # Contoh expose backend API jika ada
  # - hostname: api.box-ai.yourdomain.com
  #   service: http://localhost:3000
  - service: http_status:404
