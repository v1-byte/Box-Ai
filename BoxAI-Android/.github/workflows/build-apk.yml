name: Build Box AI APK
on:
  push:
    branches: [main]
    paths:
      - 'BoxAI-Android/**'
      - '.github/workflows/boxai-android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BoxAI-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BoxAI-debug-apk
          path: BoxAI-Android/app/build/outputs/apk/debug/app-debug.apk
